[commands.params.properties.calendar]
type = "string"
description = "The calendar's id (default primary)."
default = "primary"
maxLength = 256

[commands.params.properties.account]
type = "string"
description = "The label of the Google account. Empty: the account setting's, or the only one signed in."
maxLength = 32
pattern = "^([a-z0-9][a-z0-9._-]*)?$"

[commands.params.properties.confirm]
type = "boolean"
description = "True once the person has said yes to this event. Without it, nothing is made."

[[commands]]
kind = "google.event_update"
title = "Change an event (id, …, confirm)"
slash = "event-update"
summary = "Change an event's title, times, place, notes or attendees; needs confirm=true"

# From EventUpdateParams in proto/google/v1/google.proto: `pointman-extension manifest write`
[commands.params]
type = "object"
description = "google.event_update: change an event. Only the fields given change. Only once the person has said yes."
required = ["id"]
