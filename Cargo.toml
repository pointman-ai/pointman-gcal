[package]
name = "google"
version = "0.1.0"
edition = "2021"
description = "Gmail and Google Calendar on Pointman's nodes, for every agent, with any number of Google accounts signed in from the apps."
license = "MIT"
repository = "https://github.com/pointman-ai/pointman-google"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
# buffa's code for proto/google/v1/google.proto (build.rs) uses these: keep them at the SDK's versions
buffa = { version = "0.9.2", features = ["json"] }
getrandom = "0.2"
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", rev = "2e1afc8ecb2c53d380b873b1ba487a2a5855718b" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
ureq = { version = "2", features = ["json"] }

[build-dependencies]
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", rev = "2e1afc8ecb2c53d380b873b1ba487a2a5855718b", features = ["proto"] }

[dev-dependencies]
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", rev = "2e1afc8ecb2c53d380b873b1ba487a2a5855718b", features = ["proto"] }
toml = "0.8"

[profile.release]
strip = true
lto = true
