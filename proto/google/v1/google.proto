// The google extension's commands and settings: the source of extension.toml's `params` and `[settings]` schemas.
// Command `google.<verb>` takes `<Verb>Params` and answers `<Verb>Result`. A field's comment is its description, and
// its buf.validate rules are its limits. Gmail's and Calendar's own words are from their API references
// (https://developers.google.com/gmail/api/reference/rest, https://developers.google.com/calendar/api/v3/reference).
syntax = "proto3";

package google.v1;

import "buf/validate/validate.proto";
import "pointman/v1/options.proto";

// The extension's settings, per machine.
message Settings {
  // The label of the Google account a call uses when it names none (work, for the vault's google.work). Empty: the only one signed in; with several, reads use them all and writes stop and list them.
  string account = 1 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
}

// A Google account that couldn't be asked, and why.
message Problem {
  string account = 1;
  string error = 2;
}

// google.accounts: each Google account signed in, its address, and whether its sign-in still works.
message AccountsParams {}

message AccountsResult {
  string text = 1;
  repeated Account accounts = 2;
}

message Account {
  // Its label: the part after google. in the vault (work, for google.work).
  string label = 1;
  // Its Gmail address, as Google says it.
  string email = 2;
  // Whether Google took its sign-in just now.
  bool works = 3;
  // Why not, when it doesn't.
  string error = 4;
  // Whether it's the account setting's, used when a call names none.
  bool chosen = 5;
}

// google.mail_search: messages that match a Gmail search, newest first.
message MailSearchParams {
  // Gmail's search, as its search box takes it: from:bob newer_than:7d, is:unread in:inbox, subject:invoice.
  string query = 1 [(buf.validate.field).required = true, (buf.validate.field).string = {min_len: 1, max_len: 1000}];
  // The label of the Google account to search (work, for the vault's google.work). Empty: the account setting's, else every account signed in.
  string account = 2 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
  // How many messages, newest first, from each account (default 10).
  int32 limit = 3 [(buf.validate.field).int32 = {gte: 1, lte: 50}, (pointman.v1.setting).default = "10"];
}

message MailSearchResult {
  string text = 1;
  repeated Mail messages = 2;
  // The accounts it searched, by label.
  repeated string accounts = 3;
  repeated Problem failed = 4;
}

// A message, as a search lists it: who, what and when, and Gmail's snippet of it.
message Mail {
  // The account it's in, by label.
  string account = 1;
  // Its id, for google.mail_read and reply_to.
  string id = 2;
  string thread_id = 3;
  string from = 4;
  string to = 5;
  string subject = 6;
  // When Gmail got it (RFC 3339).
  string date = 7;
  // Gmail's first words of it: private, as the body is.
  string snippet = 8;
  // Gmail's labels on it (INBOX, UNREAD, IMPORTANT, a label's id).
  repeated string labels = 9;
  bool unread = 10;
}

// google.mail_read: one message, with its text and the names of its attachments.
message MailReadParams {
  // The message's id, from google.mail_search.
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string = {min_len: 1, max_len: 128, pattern: "^[A-Za-z0-9_-]+$"}];
  // The label of the Google account it's in. Empty: the account setting's, else each account signed in until one has it.
  string account = 2 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
}

message MailReadResult {
  // What it is, without its words: who, when and how long.
  string text = 1;
  string account = 2;
  string id = 3;
  string thread_id = 4;
  string from = 5;
  string to = 6;
  string cc = 7;
  string subject = 8;
  // When Gmail got it (RFC 3339).
  string date = 9;
  repeated string labels = 10;
  // Its text: the plain part, else the HTML part as text. Private: say what's there, and post it only when asked.
  string body = 11;
  // Whether the body was made from HTML.
  bool from_html = 12;
  // Whether the body was cut at 100,000 characters.
  bool truncated = 13;
  repeated Attachment attachments = 14;
  // Its Message-ID header.
  string message_id = 15;
}

message Attachment {
  string name = 1;
  string mime_type = 2;
  int64 bytes = 3;
}

// google.mail_draft: a draft in Gmail, nothing sent. A reply joins the message's thread.
message MailDraftParams {
  // Who it's to: addresses, or Name <address>. Left out for a reply: the message's sender.
  repeated string to = 1 [(buf.validate.field).repeated = {max_items: 100, items: {string: {min_len: 3, max_len: 320}}}];
  // Who's copied.
  repeated string cc = 2 [(buf.validate.field).repeated = {max_items: 100, items: {string: {min_len: 3, max_len: 320}}}];
  // Its subject. Left out for a reply: Re: and the message's.
  string subject = 3 [(buf.validate.field).string.max_len = 998];
  // Its text, as plain text.
  string body = 4 [(buf.validate.field).required = true, (buf.validate.field).string = {min_len: 1, max_len: 100000}];
  // The id of a message this answers (google.mail_search's): the draft goes in its thread.
  string reply_to = 5 [(buf.validate.field).string = {max_len: 128, pattern: "^([A-Za-z0-9_-]+)?$"}];
  // The label of the Google account it's from. Empty: the account setting's, or the only one signed in.
  string account = 6 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
}

message MailDraftResult {
  string text = 1;
  string account = 2;
  // The draft's id, for google.mail_send's draft.
  string draft = 3;
  string message = 4;
  string thread_id = 5;
  repeated string to = 6;
  string subject = 7;
}

// google.mail_send: send a draft, or a new message. It goes at once: send only what the task or workflow asked for.
message MailSendParams {
  // A draft's id (google.mail_draft's) to send as it is. Or leave it out and give to, subject and body.
  string draft = 1 [(buf.validate.field).string = {max_len: 128, pattern: "^([A-Za-z0-9_-]+)?$"}];
  // Who it's to: addresses, or Name <address>.
  repeated string to = 2 [(buf.validate.field).repeated = {max_items: 100, items: {string: {min_len: 3, max_len: 320}}}];
  // Who's copied.
  repeated string cc = 3 [(buf.validate.field).repeated = {max_items: 100, items: {string: {min_len: 3, max_len: 320}}}];
  string subject = 4 [(buf.validate.field).string.max_len = 998];
  // Its text, as plain text.
  string body = 5 [(buf.validate.field).string.max_len = 100000];
  // The label of the Google account it's from. Empty: the account setting's, or the only one signed in.
  string account = 6 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
}

message MailSendResult {
  string text = 1;
  string account = 2;
  // The sent message's id.
  string message = 3;
  string thread_id = 4;
  repeated string to = 5;
  string subject = 6;
}

// google.calendars: the calendars each account has.
message CalendarsParams {
  // The label of the Google account. Empty: the account setting's, else every account signed in.
  string account = 1 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
}

message CalendarsResult {
  string text = 1;
  repeated Calendar calendars = 2;
  repeated Problem failed = 3;
}

message Calendar {
  string account = 1;
  // Its id, for calendar: primary is the account's own.
  string id = 2;
  string name = 3;
  bool primary = 4;
  // What the account may do with it: owner, writer, reader or freeBusyReader.
  string role = 5;
  string time_zone = 6;
}

// google.events: a calendar's events between two times, soonest first, each repeat on its own.
message EventsParams {
  // From when: RFC 3339 (2026-11-03T09:00:00+08:00), or a day (2026-11-03) from its midnight UTC.
  string from = 1 [(buf.validate.field).required = true, (buf.validate.field).string = {min_len: 10, max_len: 40}];
  // Until when, as from says it.
  string to = 2 [(buf.validate.field).required = true, (buf.validate.field).string = {min_len: 10, max_len: 40}];
  // The calendar's id, from google.calendars (default primary, the account's own).
  string calendar = 3 [(buf.validate.field).string.max_len = 256, (pointman.v1.setting).default = "primary"];
  // Only events with these words (in their title, description, place or people).
  string query = 4 [(buf.validate.field).string.max_len = 500];
  // The label of the Google account. Empty: the account setting's, else every account signed in.
  string account = 5 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
}

message EventsResult {
  string text = 1;
  repeated Event events = 2;
  repeated Problem failed = 3;
}

message Event {
  string account = 1;
  string calendar = 2;
  // Its id, for google.event_update and google.event_delete.
  string id = 3;
  string title = 4;
  // When it starts: RFC 3339, or a day for an all-day event.
  string start = 5;
  // When it ends: RFC 3339, or the day after an all-day event's last.
  string end = 6;
  bool all_day = 7;
  string location = 8;
  string description = 9;
  repeated Attendee attendees = 10;
  string organizer = 11;
  // confirmed, tentative or cancelled.
  string status = 12;
  // Its page in Google Calendar.
  string url = 13;
  // Its Google Meet link, if it has one.
  string meet = 14;
  // The repeating event it's one of, if it is.
  string recurring_event_id = 15;
}

message Attendee {
  string email = 1;
  string name = 2;
  // needsAction, accepted, tentative or declined.
  string response = 3;
  bool organizer = 4;
}

// google.event_create: a new event. Only once the person has said yes.
message EventCreateParams {
  string title = 1 [(buf.validate.field).required = true, (buf.validate.field).string = {min_len: 1, max_len: 1024}];
  // When it starts: RFC 3339 (2026-11-05T10:00:00+08:00), a local time with time_zone (2026-11-05T10:00:00), or a day for an all-day event (2026-11-05).
  string start = 2 [(buf.validate.field).required = true, (buf.validate.field).string = {min_len: 10, max_len: 40}];
  // When it ends, as start says it. An all-day event's end is the day after its last.
  string end = 3 [(buf.validate.field).required = true, (buf.validate.field).string = {min_len: 10, max_len: 40}];
  // The time zone start and end are in, IANA's name (Asia/Singapore). Left out: their offset, else the calendar's.
  string time_zone = 4 [(buf.validate.field).string.max_len = 64];
  string description = 5 [(buf.validate.field).string.max_len = 8000];
  string location = 6 [(buf.validate.field).string.max_len = 1024];
  // Who's invited, by address.
  repeated string attendees = 7 [(buf.validate.field).repeated = {max_items: 100, items: {string: {min_len: 3, max_len: 320}}}];
  // Give it a Google Meet link.
  bool meet = 8;
  // Email the attendees an invitation (Google's sendUpdates=all). Left out: no email.
  bool notify = 9;
  // The calendar's id (default primary).
  string calendar = 10 [(buf.validate.field).string.max_len = 256, (pointman.v1.setting).default = "primary"];
  // The label of the Google account. Empty: the account setting's, or the only one signed in.
  string account = 11 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
  // True once the person has said yes to this event. Without it, nothing is made.
  bool confirm = 12;
}

message EventCreateResult {
  string text = 1;
  Event event = 2;
}

// google.event_update: change an event. Only the fields given change. Only once the person has said yes.
message EventUpdateParams {
  // The event's id, from google.events.
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string = {min_len: 1, max_len: 1024}];
  optional string title = 2 [(buf.validate.field).string = {min_len: 1, max_len: 1024}];
  // A new start, as google.event_create's.
  optional string start = 3 [(buf.validate.field).string = {min_len: 10, max_len: 40}];
  // A new end, as google.event_create's.
  optional string end = 4 [(buf.validate.field).string = {min_len: 10, max_len: 40}];
  // The time zone a new start and end are in.
  string time_zone = 5 [(buf.validate.field).string.max_len = 64];
  optional string description = 6 [(buf.validate.field).string.max_len = 8000];
  optional string location = 7 [(buf.validate.field).string.max_len = 1024];
  // Everyone invited, replacing who was. Empty or left out: unchanged.
  repeated string attendees = 8 [(buf.validate.field).repeated = {max_items: 100, items: {string: {min_len: 3, max_len: 320}}}];
  // Email the attendees the change (Google's sendUpdates=all). Left out: no email.
  bool notify = 9;
  // The calendar's id (default primary).
  string calendar = 10 [(buf.validate.field).string.max_len = 256, (pointman.v1.setting).default = "primary"];
  // The label of the Google account. Empty: the account setting's, or the only one signed in.
  string account = 11 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
  // True once the person has said yes to this change. Without it, nothing changes.
  bool confirm = 12;
}

message EventUpdateResult {
  string text = 1;
  Event event = 2;
  // The fields it changed (title, start, end, time_zone, description, location, attendees).
  repeated string changed = 3;
}

// google.event_delete: delete an event. Only once the person has said yes.
message EventDeleteParams {
  // The event's id, from google.events.
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string = {min_len: 1, max_len: 1024}];
  // Email the attendees that it's off (Google's sendUpdates=all). Left out: no email.
  bool notify = 2;
  // The calendar's id (default primary).
  string calendar = 3 [(buf.validate.field).string.max_len = 256, (pointman.v1.setting).default = "primary"];
  // The label of the Google account. Empty: the account setting's, or the only one signed in.
  string account = 4 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
  // True once the person has said yes to deleting it. Without it, nothing is deleted.
  bool confirm = 5;
}

message EventDeleteResult {
  string text = 1;
  string account = 2;
  string id = 3;
  string title = 4;
}

// google.freebusy: when calendars are busy between two times.
message FreebusyParams {
  // From when: RFC 3339, or a day from its midnight UTC.
  string from = 1 [(buf.validate.field).required = true, (buf.validate.field).string = {min_len: 10, max_len: 40}];
  // Until when, as from says it.
  string to = 2 [(buf.validate.field).required = true, (buf.validate.field).string = {min_len: 10, max_len: 40}];
  // Whose calendars, by address (or a calendar's id). Left out: the account's own.
  repeated string emails = 3 [(buf.validate.field).repeated = {max_items: 50, items: {string: {min_len: 3, max_len: 320}}}];
  // The label of the Google account that asks. Empty: the account setting's, else every account signed in.
  string account = 4 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
}

message FreebusyResult {
  string text = 1;
  repeated Busy calendars = 2;
  repeated Problem failed = 3;
}

// One calendar's busy times.
message Busy {
  // The account that asked.
  string account = 1;
  // The address or calendar asked about.
  string email = 2;
  repeated Span busy = 3;
  // Why Google couldn't say (notFound, or not shared with the account).
  string error = 4;
}

message Span {
  string start = 1;
  string end = 2;
}

// google.add: a Google account's sign-in, added in the apps.
message AddParams {
  // What to call it (work): lowercase letters, digits, . _ -
  string name = 1 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
}

message AddResult {
  string text = 1;
}

// google.client: the Google OAuth client the sign-ins go through, added in the apps.
message ClientParams {}

message ClientResult {
  string text = 1;
}
